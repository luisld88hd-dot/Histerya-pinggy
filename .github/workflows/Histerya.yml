
name: Hysteria 2 with Pinggy UDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hysteria:
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Hysteria 2
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://get.hy2.sh/ \
            -o "$RUNNER_TEMP/install-hy2.sh"

          sudo bash "$RUNNER_TEMP/install-hy2.sh"

          hysteria version

      - name: Install Pinggy CLI
        run: npm install -g pinggy

      - name: Start Hysteria and Pinggy UDP
        shell: bash
        env:
          PINGGY_TOKEN: ${{ secrets.PINGGY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PINGGY_TOKEN:-}" ]; then
            echo "ERROR: PINGGY_TOKEN secret is missing."
            exit 1
          fi

          PORT=8443
          SNI="hysteria-pinggy"
          HY2_LOG="$RUNNER_TEMP/hysteria.log"
          PINGGY_LOG="$RUNNER_TEMP/pinggy.log"
          CONFIG="$RUNNER_TEMP/config.yaml"

          HY2_PID=""
          PINGGY_PID=""
          TAIL_PID=""

          cleanup() {
            [ -n "$TAIL_PID" ] && kill "$TAIL_PID" 2>/dev/null || true
            [ -n "$PINGGY_PID" ] && kill "$PINGGY_PID" 2>/dev/null || true
            [ -n "$HY2_PID" ] && kill "$HY2_PID" 2>/dev/null || true
          }

          trap cleanup EXIT INT TERM

          # Generate TLS certificate
          openssl req -x509 -newkey rsa:2048 -sha256 \
            -days 2 -nodes \
            -keyout "$RUNNER_TEMP/server.key" \
            -out "$RUNNER_TEMP/server.crt" \
            -subj "/CN=$SNI" \
            -addext "subjectAltName=DNS:$SNI"

          chmod 600 "$RUNNER_TEMP/server.key"

          # Generate password
          PASSWORD="$(openssl rand -hex 24)"

          # Calculate certificate fingerprint
          CERT_PIN="$(openssl x509 \
            -in "$RUNNER_TEMP/server.crt" \
            -noout -fingerprint -sha256 \
            | sed 's/.*=//' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          # Configure Hysteria
          cat > "$CONFIG" <<EOF
          listen: ":$PORT"

          tls:
            cert: "$RUNNER_TEMP/server.crt"
            key: "$RUNNER_TEMP/server.key"

          auth:
            type: password
            password: "$PASSWORD"
          EOF

          chmod 600 "$CONFIG"

          # Start Hysteria
          echo "Starting Hysteria 2..."

          hysteria server -c "$CONFIG" > "$HY2_LOG" 2>&1 &
          HY2_PID=$!

          sleep 3

          if ! kill -0 "$HY2_PID" 2>/dev/null; then
            echo "ERROR: Hysteria failed to start."
            cat "$HY2_LOG"
            exit 1
          fi

          echo "Hysteria is listening on UDP $PORT."

          # Start Pinggy UDP tunnel
          echo "Starting Pinggy UDP tunnel..."

          pinggy \
            --type udp \
            --localport "$PORT" \
            --token "$PINGGY_TOKEN" \
            --v > "$PINGGY_LOG" 2>&1 &

          PINGGY_PID=$!

          # Wait for Pinggy to allocate its public endpoint
          REMOTE_URL=""

          for i in $(seq 1 120); do

            if ! kill -0 "$HY2_PID" 2>/dev/null; then
              echo "ERROR: Hysteria stopped unexpectedly."
              cat "$HY2_LOG"
              exit 1
            fi

            if ! kill -0 "$PINGGY_PID" 2>/dev/null; then
              echo "ERROR: Pinggy stopped unexpectedly."
              cat "$PINGGY_LOG"
              exit 1
            fi

            REMOTE_URL="$(sed -E \
              's/\x1B\[[0-9;]*[[:alpha:]]//g' \
              "$PINGGY_LOG" \
              | grep -Eo 'udp://[A-Za-z0-9.-]+:[0-9]+' \
              | tail -n 1 || true)"

            if [ -n "$REMOTE_URL" ]; then
              break
            fi

            sleep 1
          done

          if [ -z "$REMOTE_URL" ]; then
            echo "ERROR: Could not detect Pinggy public UDP endpoint."
            cat "$PINGGY_LOG"
            exit 1
          fi

          # Extract public hostname and port
          ENDPOINT="${REMOTE_URL#udp://}"
          PUBLIC_HOST="${ENDPOINT%:*}"
          PUBLIC_PORT="${ENDPOINT##*:}"

          if ! [[ "$PUBLIC_PORT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid public UDP port."
            exit 1
          fi

          # Construct Hysteria 2 import URI
          URI="hysteria2://${PASSWORD}@${PUBLIC_HOST}:${PUBLIC_PORT}/?sni=${SNI}&insecure=1&pinSHA256=${CERT_PIN}#Hysteria-Pinggy"

          # Print Pinggy connection information
          cat "$PINGGY_LOG"

          echo ""
          echo "================================================"
          echo "          HYSTERIA 2 SERVER READY"
          echo "================================================"
          echo ""
          echo "SERVER ADDRESS: $PUBLIC_HOST"
          echo "PUBLIC PORT: $PUBLIC_PORT"
          echo "LOCAL PORT: $PORT"
          echo "PROTOCOL: UDP / QUIC"
          echo "USERNAME: Not required"
          echo "PASSWORD: $PASSWORD"
          echo "SNI: $SNI"
          echo "TLS: Enabled"
          echo "TLS INSECURE: Enabled with certificate pin"
          echo "CERTIFICATE SHA256: $CERT_PIN"
          echo ""
          echo "COMPLETE ANDROID IMPORT URI:"
          echo ""
          echo "$URI"
          echo ""
          echo "================================================"
          echo "Keep this GitHub Actions job running."
          echo "================================================"

          # Continue displaying Pinggy logs
          tail -n 0 -F "$PINGGY_LOG" &
          TAIL_PID=$!

          # Keep both services alive
          while kill -0 "$HY2_PID" 2>/dev/null &&
                kill -0 "$PINGGY_PID" 2>/dev/null; do
            sleep 5
          done

          echo "ERROR: One of the services stopped."
          cat "$HY2_LOG"
          cat "$PINGGY_LOG"
          exit 1
