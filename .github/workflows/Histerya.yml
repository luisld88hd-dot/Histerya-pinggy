
      - name: Iniciar túnel UDP de Pinggy
        env:
          PINGGY_TOKEN: ${{ secrets.PINGGY_TOKEN }}
        run: |
          set -e

          if [ -z "$PINGGY_TOKEN" ]; then
            echo "ERROR: Falta PINGGY_TOKEN"
            exit 1
          fi

          nohup stdbuf -oL -eL pinggy \
            -p 443 \
            -R0:localhost:8443 \
            "${PINGGY_TOKEN}+udp@br.free.pinggy.io" \
            > /tmp/pinggy.log 2>&1 &

          echo "Esperando el túnel UDP..."

          ENDPOINT=""

          for i in $(seq 1 90); do
            ENDPOINT="$(grep -oE 'udp://[^[:space:]]+' /tmp/pinggy.log | head -n 1 | tr -d '\r' || true)"

            if [ -n "$ENDPOINT" ]; then
              break
            fi

            if ! pgrep -af 'pinggy' | grep -q 'br.free.pinggy.io'; then
              echo "ERROR: Pinggy se detuvo."
              cat /tmp/pinggy.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$ENDPOINT" ]; then
            echo "ERROR: No se encontró la dirección UDP."
            cat /tmp/pinggy.log
            exit 1
          fi

          export ENDPOINT

          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ["ENDPOINT"])

          if parsed.scheme != "udp" or not parsed.hostname or not parsed.port:
              raise SystemExit("Endpoint UDP inválido")

          host = parsed.hostname
          if ":" in host:
              host = "[" + host + "]"

          print("PUBLIC_HOST=" + host)
          print("PUBLIC_PORT=" + str(parsed.port))
          PY

          echo "Túnel UDP detectado correctamente."
