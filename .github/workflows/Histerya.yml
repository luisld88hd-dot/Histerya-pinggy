name: Hysteria 2 con Pinggy UDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hysteria:
    runs-on: ubuntu-latest
    timeout-minutes: 59

    steps:
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar, iniciar Hysteria y crear túnel
        shell: bash
        env:
          PINGGY_TOKEN: ${{ secrets.PINGGY_TOKEN }}
        run: |
          set -Eeuo pipefail

          echo "===================================="
          echo "INSTALANDO HYSTERIA 2"
          echo "===================================="

          if [[ -z "${PINGGY_TOKEN:-}" ]]; then
            echo "ERROR: No existe el secreto PINGGY_TOKEN."
            exit 1
          fi

          DIR="${RUNNER_TEMP}/hysteria-pinggy"
          BIN="${RUNNER_TEMP}/bin"

          mkdir -p "$DIR" "$BIN"

          # Descargar el ejecutable oficial de Hysteria 2.
          curl -fL --retry 3 \
            "https://download.hysteria.network/app/latest/hysteria-linux-amd64" \
            -o "$BIN/hysteria"

          chmod +x "$BIN/hysteria"

          HY2="$BIN/hysteria"

          "$HY2" --help >/dev/null

          echo "Hysteria instalado correctamente."

          # Instalar Pinggy.
          echo "===================================="
          echo "INSTALANDO PINGGY"
          echo "===================================="

          npm install -g pinggy

          NPM_PREFIX="$(npm prefix -g)"
          export PATH="${NPM_PREFIX}/bin:${PATH}"

          if ! command -v pinggy >/dev/null 2>&1; then
            echo "ERROR: No se encontró el ejecutable de Pinggy."
            echo "Ruta npm: $NPM_PREFIX"
            exit 1
          fi

          PINGGY="$(command -v pinggy)"

          echo "Pinggy instalado correctamente: $PINGGY"

          # Crear contraseña.
          PASSWORD="$(openssl rand -hex 24)"
          PORT=8443

          # Crear certificado.
          echo "===================================="
          echo "CREANDO CERTIFICADO"
          echo "===================================="

          openssl req -x509 -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -days 2 \
            -keyout "$DIR/server.key" \
            -out "$DIR/server.crt" \
            -subj "/CN=hy2.local" \
            -addext "subjectAltName=DNS:hy2.local"

          # Configuración del servidor.
          cat > "$DIR/config.yaml" <<EOF
          listen: 0.0.0.0:${PORT}

          tls:
            cert: ${DIR}/server.crt
            key: ${DIR}/server.key
            sniGuard: disable

          auth:
            type: password
            password: ${PASSWORD}
          EOF

          # Iniciar Hysteria.
          echo "===================================="
          echo "INICIANDO SERVIDOR HYSTERIA"
          echo "===================================="

          "$HY2" server -c "$DIR/config.yaml" \
            > "$DIR/hysteria.log" 2>&1 &

          HY2_PID=$!

          sleep 3

          if ! kill -0 "$HY2_PID" 2>/dev/null; then
            echo "ERROR: Hysteria no pudo arrancar."
            cat "$DIR/hysteria.log"
            exit 1
          fi

          echo "Servidor Hysteria iniciado."

          # Iniciar Pinggy UDP.
          echo "===================================="
          echo "INICIANDO TUNEL PINGGY UDP"
          echo "===================================="

          "$PINGGY" \
            --type udp \
            --localport "$PORT" \
            --token "$PINGGY_TOKEN" \
            --v \
            > "$DIR/pinggy.log" 2>&1 &

          PINGGY_PID=$!

          # Esperar la dirección pública.
          ENDPOINT=""

          for attempt in $(seq 1 120); do

            ENDPOINT="$(grep -Eo 'udp://[^[:space:]]+' \
              "$DIR/pinggy.log" | head -n 1 || true)"

            if [[ -n "$ENDPOINT" ]]; then
              break
            fi

            if ! kill -0 "$PINGGY_PID" 2>/dev/null; then
              echo "ERROR: Pinggy terminó inesperadamente."
              cat "$DIR/pinggy.log"
              exit 1
            fi

            sleep 1
          done

          if [[ -z "$ENDPOINT" ]]; then
            echo "ERROR: Pinggy no proporcionó una dirección UDP."
            cat "$DIR/pinggy.log"
            exit 1
          fi

          # Separar dirección y puerto público.
          ENDPOINT="${ENDPOINT#udp://}"

          PUBLIC_HOST="${ENDPOINT%:*}"
          PUBLIC_PORT="${ENDPOINT##*:}"

          if [[ -z "$PUBLIC_HOST" || ! "$PUBLIC_PORT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Dirección UDP no válida: $ENDPOINT"
            exit 1
          fi

          # Crear URI para Agent VPN.
          URI="hysteria2://${PASSWORD}@${PUBLIC_HOST}:${PUBLIC_PORT}/?insecure=1#AgentVPN"

          echo ""
          echo "============================================"
          echo "          HYSTERIA 2 FUNCIONANDO"
          echo "============================================"
          echo ""
          echo "SERVIDOR: $PUBLIC_HOST"
          echo "PUERTO UDP PUBLICO: $PUBLIC_PORT"
          echo "PUERTO LOCAL: $PORT"
          echo "PROTOCOLO: Hysteria 2"
          echo "CONTRASEÑA: $PASSWORD"
          echo "TLS: insecure=1"
          echo ""
          echo "========== URI PARA AGENT VPN ============"
          echo "$URI"
          echo "============================================"
          echo ""

          echo "Manteniendo el servidor y el túnel activos..."

          # Mantener ambos procesos funcionando.
          while true; do

            if ! kill -0 "$HY2_PID" 2>/dev/null; then
              echo "ERROR: Hysteria se detuvo."
              cat "$DIR/hysteria.log"
              exit 1
            fi

            if ! kill -0 "$PINGGY_PID" 2>/dev/null; then
              echo "ERROR: Pinggy se detuvo."
              cat "$DIR/pinggy.log"
              exit 1
            fi

            sleep 10
          done
