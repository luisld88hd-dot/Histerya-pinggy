name: Hysteria 2 con Pinggy UDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hysteria:
    runs-on: ubuntu-latest
    timeout-minutes: 59

    steps:
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Iniciar Hysteria 2 y Pinggy UDP
        shell: bash
        env:
          PINGGY_TOKEN: ${{ secrets.PINGGY_TOKEN }}
        run: |
          set -Eeuo pipefail

          DIR="${RUNNER_TEMP}/hysteria-pinggy"
          BIN="${RUNNER_TEMP}/bin"

          mkdir -p "$DIR" "$BIN"

          echo "===== INSTALANDO HYSTERIA ====="

          if [[ -z "${PINGGY_TOKEN:-}" ]]; then
            echo "ERROR: falta el secreto PINGGY_TOKEN."
            exit 1
          fi

          curl -fL --retry 3 \
            "https://download.hysteria.network/app/latest/hysteria-linux-amd64" \
            -o "$BIN/hysteria"

          chmod +x "$BIN/hysteria"

          HY2="$BIN/hysteria"
          "$HY2" --help >/dev/null

          echo "Hysteria instalado correctamente."

          echo "===== INSTALANDO PINGGY ====="

          npm install -g pinggy

          NPM_PREFIX="$(npm prefix -g)"
          export PATH="${NPM_PREFIX}/bin:${PATH}"

          PINGGY="$(command -v pinggy)"

          if [[ -z "$PINGGY" ]]; then
            echo "ERROR: no se encontró Pinggy."
            exit 1
          fi

          echo "Pinggy instalado: $PINGGY"

          echo "===== CREANDO CERTIFICADO ====="

          PASSWORD="$(openssl rand -hex 24)"
          PORT=8443

          openssl req -x509 -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -days 2 \
            -keyout "$DIR/server.key" \
            -out "$DIR/server.crt" \
            -subj "/CN=hy2.local" \
            -addext "subjectAltName=DNS:hy2.local"

          cat > "$DIR/config.yaml" <<EOF
          listen: 0.0.0.0:${PORT}

          tls:
            cert: ${DIR}/server.crt
            key: ${DIR}/server.key
            sniGuard: disable

          auth:
            type: password
            password: ${PASSWORD}
          EOF

          echo "===== INICIANDO HYSTERIA ====="

          "$HY2" server -c "$DIR/config.yaml" \
            > "$DIR/hysteria.log" 2>&1 &

          HY2_PID=$!

          sleep 3

          if ! kill -0 "$HY2_PID" 2>/dev/null; then
            echo "ERROR: Hysteria no pudo arrancar."
            cat "$DIR/hysteria.log"
            exit 1
          fi

          echo "Hysteria iniciado correctamente."

          echo "===== INICIANDO PINGGY UDP ====="

          "$PINGGY" \
            --type udp \
            --localport "$PORT" \
            --token "$PINGGY_TOKEN" \
            --v \
            > "$DIR/pinggy.log" 2>&1 &

          PINGGY_PID=$!

          echo "Esperando dirección pública..."

          ENDPOINT=""

          for attempt in $(seq 1 120); do

            # Limpiar códigos ANSI y retornos de carro.
            CLEAN_LOG="$(
              sed -E 's/\x1B\[[0-9;?]*[ -/]*[@-~]//g' \
                "$DIR/pinggy.log" | tr -d '\r'
            )"

            # Buscar primero la dirección UDP completa.
            ENDPOINT="$(
              printf '%s\n' "$CLEAN_LOG" |
              grep -Eo 'udp://[^[:space:]]+' |
              tail -n 1 || true
            )"

            # Compatibilidad si Pinggy imprime el host sin udp://.
            if [[ -z "$ENDPOINT" ]]; then
              ENDPOINT="$(
                printf '%s\n' "$CLEAN_LOG" |
                grep -Eo '[[:alnum:]][[:alnum:].-]*:[0-9]{1,5}' |
                tail -n 1 || true
              )"
            fi

            if [[ -n "$ENDPOINT" ]]; then
              break
            fi

            if ! kill -0 "$PINGGY_PID" 2>/dev/null; then
              echo "ERROR: Pinggy se cerró inesperadamente."
              cat "$DIR/pinggy.log"
              exit 1
            fi

            sleep 1
          done

          if [[ -z "$ENDPOINT" ]]; then
            echo "ERROR: Pinggy no entregó dirección pública."
            cat "$DIR/pinggy.log"
            exit 1
          fi

          # Quitar prefijo y signos de puntuación finales.
          ENDPOINT="${ENDPOINT#udp://}"
          ENDPOINT="${ENDPOINT%,}"
          ENDPOINT="${ENDPOINT%;}"
          ENDPOINT="${ENDPOINT%)}"
          ENDPOINT="${ENDPOINT%/}"

          echo "Dirección recibida: $ENDPOINT"

          # Extraer el puerto numérico del final.
          PUBLIC_PORT="$(printf '%s' "$ENDPOINT" |
            sed -nE 's/.*:([0-9]{1,5})$/\1/p')"

          if [[ -z "$PUBLIC_PORT" ]]; then
            echo "ERROR: no se pudo extraer el puerto."
            printf 'Valor exacto: %q\n' "$ENDPOINT"
            cat "$DIR/pinggy.log"
            exit 1
          fi

          PUBLIC_HOST="${ENDPOINT%:$PUBLIC_PORT}"

          if [[ -z "$PUBLIC_HOST" ]]; then
            echo "ERROR: no se pudo extraer el dominio."
            exit 1
          fi

          echo "Dominio detectado: $PUBLIC_HOST"
          echo "Puerto detectado: $PUBLIC_PORT"

          URI="hysteria2://${PASSWORD}@${PUBLIC_HOST}:${PUBLIC_PORT}/?insecure=1#AgentVPN"

          echo ""
          echo "=========================================="
          echo "          HYSTERIA 2 LISTO"
          echo "=========================================="
          echo ""
          echo "SERVIDOR: $PUBLIC_HOST"
          echo "PUERTO UDP PUBLICO: $PUBLIC_PORT"
          echo "PUERTO LOCAL: $PORT"
          echo "PROTOCOLO: Hysteria 2"
          echo "CONTRASEÑA: $PASSWORD"
          echo ""
          echo "========== URI PARA AGENT VPN ============"
          echo "$URI"
          echo "=========================================="
          echo ""

          echo "Manteniendo los procesos activos..."

          while true; do

            if ! kill -0 "$HY2_PID" 2>/dev/null; then
              echo "ERROR: Hysteria se detuvo."
              cat "$DIR/hysteria.log"
              exit 1
            fi

            if ! kill -0 "$PINGGY_PID" 2>/dev/null; then
              echo "ERROR: Pinggy se detuvo."
              cat "$DIR/pinggy.log"
              exit 1
            fi

            sleep 10
          done
