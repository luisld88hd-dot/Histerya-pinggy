name: Hysteria 2 con Pinggy UDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hysteria:
    runs-on: ubuntu-latest
    timeout-minutes: 59

    steps:
      - name: Instalar dependencias
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Hysteria 2 y Pinggy
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y curl openssl ca-certificates

          curl -fsSL https://get.hy2.sh/ | bash
          npm install -g pinggy

          command -v hysteria
          command -v pinggy

      - name: Crear servidor y túnel UDP
        shell: bash
        env:
          PINGGY_TOKEN: ${{ secrets.PINGGY_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${PINGGY_TOKEN:-}" ]]; then
            echo "ERROR: falta el secreto PINGGY_TOKEN."
            exit 1
          fi

          PORT=8443
          DIR="${RUNNER_TEMP}/hysteria-pinggy"
          mkdir -p "$DIR"

          PASSWORD="$(openssl rand -hex 24)"

          # Certificado autofirmado para esta ejecución.
          openssl req -x509 -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -days 2 \
            -keyout "$DIR/server.key" \
            -out "$DIR/server.crt" \
            -subj "/CN=hy2.local" \
            -addext "subjectAltName=DNS:hy2.local"

          # Configuración del servidor Hysteria 2.
          cat > "$DIR/config.yaml" <<EOF
          listen: 0.0.0.0:${PORT}

          tls:
            cert: ${DIR}/server.crt
            key: ${DIR}/server.key
            sniGuard: disable

          auth:
            type: password
            password: ${PASSWORD}
          EOF

          echo "Iniciando Hysteria 2..."

          hysteria server -c "$DIR/config.yaml" \
            > "$DIR/hysteria.log" 2>&1 &

          HY2_PID=$!

          sleep 3

          if ! kill -0 "$HY2_PID" 2>/dev/null; then
            echo "ERROR: Hysteria no pudo iniciarse."
            cat "$DIR/hysteria.log"
            exit 1
          fi

          echo "Hysteria está funcionando."

          # Crear el túnel UDP de Pinggy.
          echo "Iniciando túnel UDP de Pinggy..."

          pinggy \
            --type udp \
            --localport "127.0.0.1:${PORT}" \
            --token "$PINGGY_TOKEN" \
            --v \
            > "$DIR/pinggy.log" 2>&1 &

          PINGGY_PID=$!

          # Esperar a que Pinggy proporcione la dirección pública.
          ENDPOINT=""

          for attempt in $(seq 1 120); do
            ENDPOINT="$(grep -Eo 'udp://[^[:space:]]+' "$DIR/pinggy.log" | head -n 1 || true)"

            if [[ -n "$ENDPOINT" ]]; then
              break
            fi

            if ! kill -0 "$PINGGY_PID" 2>/dev/null; then
              echo "ERROR: Pinggy se cerró antes de crear el túnel."
              cat "$DIR/pinggy.log"
              exit 1
            fi

            sleep 1
          done

          if [[ -z "$ENDPOINT" ]]; then
            echo "ERROR: no se recibió la dirección UDP de Pinggy."
            cat "$DIR/pinggy.log"
            exit 1
          fi

          # Separar hostname y puerto público.
          ENDPOINT="${ENDPOINT#udp://}"
          PUBLIC_HOST="${ENDPOINT%:*}"
          PUBLIC_PORT="${ENDPOINT##*:}"

          if [[ -z "$PUBLIC_HOST" || ! "$PUBLIC_PORT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: dirección UDP recibida no válida: $ENDPOINT"
            cat "$DIR/pinggy.log"
            exit 1
          fi

          # Perfil simplificado para Agent VPN.
          URI="hysteria2://${PASSWORD}@${PUBLIC_HOST}:${PUBLIC_PORT}/?insecure=1#AgentVPN"

          echo ""
          echo "=========================================="
          echo "       HYSTERIA 2 CONECTADO"
          echo "=========================================="
          echo ""
          echo "SERVIDOR: $PUBLIC_HOST"
          echo "PUERTO UDP: $PUBLIC_PORT"
          echo "PUERTO LOCAL: $PORT"
          echo "PROTOCOLO: Hysteria 2"
          echo "CONTRASEÑA: $PASSWORD"
          echo "TLS: insecure=1"
          echo ""
          echo "========== URI PARA AGENT VPN =========="
          echo "$URI"
          echo "========================================"
          echo ""

          echo "El servidor y el túnel permanecerán activos."
          echo "No detengas esta ejecución."

          # Mantener vivos ambos procesos.
          while kill -0 "$HY2_PID" 2>/dev/null && kill -0 "$PINGGY_PID" 2>/dev/null; do
            sleep 10
          done

          echo "ERROR: uno de los procesos se detuvo."
          echo "----- LOG HYSTERIA -----"
          cat "$DIR/hysteria.log"
          echo "----- LOG PINGGY -----"
          cat "$DIR/pinggy.log"

          exit 1
